app = "floosball-api"
primary_region = "ord"

[build]

[env]
  PORT = "8080"
  DATABASE_DIR = "/data"
  TIMING_MODE = "scheduled"
  # Keep fewer backups: the DB is ~90M and grows each season, so the default 7
  # (~630M) overran the 974M volume. 3 leaves ample headroom and 3 recovery points.
  BACKUP_KEEP = "3"
  # Destination preference is a PREFERENCE, not a veto: a club below a player's Appeal
  # demand rates him lower instead of being unable to sign him at all. Stated here rather
  # than left to the code default so the deployed behaviour is visible in the deploy config.
  # 0.90 puts the crossover at about 8 rating points -- a club weighing fit against talent.
  # At the old 0.75 a poor-fit club still preferred a 71 who suited it over a 94 who did not,
  # which is a veto wearing a preference's name. FLOOS_SOFT_APPEAL = "0" restores the veto.
  FLOOS_SOFT_APPEAL = "1"
  FLOOS_SOFT_APPEAL_PENALTY = "0.90"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    type = "http"
    port = 8080
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = "2gb"
  cpu_kind = "performance"
  cpus = 1

[mounts]
  source = "floosball_data"
  destination = "/data"
