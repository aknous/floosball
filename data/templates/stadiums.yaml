  icon: cavern
  tagline: Carved in Stone
  description: |
    Play happens under a few hundred feet of rock. Every sound comes back twice, the
    lighting is strung on cables, and the far end of the cavern is simply dark.
  effects:
    deepPassChance: 0.93
    fumbleRate: 0.94
    puntDistance: 0.92
  weather:
    - key: stillair
      label: "Still Air"
      text: "Dead still and cool. Sound carries strangely, but the field is clean."
      effects: {}
    - key: seep
      label: "Seepage"
      text: "Water is coming through the rock and pooling on the field. The ball is wet."
      effects: {passAccuracy: 0.93, fumbleRate: 1.15, runYardage: 0.94}
