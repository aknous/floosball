      effects: {paceMod: 0.88, deepPassChance: 0.88, runYardage: 0.94}
    - key: loop
      label: "The Loop Tightens"
      unrealOnly: true
      text: "The same minute is happening more than once. The players have noticed."
      effects: {paceMod: 0.70, passAccuracy: 0.85, fumbleRate: 1.30, deepPassChance: 0.70}

