    fumbleRate: 1.08
    runYardage: 0.96
  weather:
    - key: ripe
      label: "Ripe"
      text: "Warm and still. The fruit is intact, for now."
      effects: {}
    - key: humid
      label: "Growing Weather"
      text: "Heavy humid air. The ball is slick and the vines are visibly moving."
      effects: {passAccuracy: 0.94, fumbleRate: 1.12}
    - key: burst
      label: "Burst Fruit"
      text: "Split melons all over the field. The footing is sugar and pulp."
      effects: {runYardage: 0.88, fumbleRate: 1.20, returnYards: 0.88}
    - key: overgrowth
      label: "Overgrowth"
      unrealOnly: true
      text: "The vines are growing fast enough to watch. They are taking the field back."
      effects: {runYardage: 0.70, paceMod: 1.30, sackRate: 1.25, deepPassChance: 0.75}

6:
