  setting: A field at the foot of an enormous fountain, where the drink is mixed to order and never sealed.
  icon: fizz
  tagline: Mixed, Not Sealed
  description: |
    The archive carries two names for one drink and two cities each certain the other is
    wrong. This one holds that the word belongs to the drink and not to a noise, and that
    anything worth drinking is mixed at a counter rather than capped by a machine. The
    field sits at the foot of the fountain. The air is full of it.
  effects:
    paceMod: 1.041
    footing: 0.959
    fumbleRate: 1.049
  weather:
    - key: flat
      label: "Gone Flat"
      text: "The fizz has died down. Sticky underfoot but otherwise playable."
      effects: {}
    - key: carbonation
      label: "Heavy Carbonation"
      text: "The air is full of bubbles and the ball will not sit still in anyone's hands."
      effects: {fumbleRate: 1.159, passAccuracy: 0.938}
    - key: syruprain
      label: "Syrup Rain"
      text: "Syrup coming down from the rim. Everything it lands on stops moving quite right."
      effects: {footing: 0.929, paceMod: 1.071, sackRate: 1.071}
    - key: eruption
      label: "Eruption"
      unrealOnly: true
      text: "The whole fountain has gone up. The field is under it and still in play."
