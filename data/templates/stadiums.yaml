  name: "Cloud Gate"
  setting: A field at the bottom of a valley that fills, daily, with soup-thick fog.
  icon: fog-bank
  tagline: Soupy
  description: |
    The fog sits in the bowl of the ground and does not lift. On a bad day you cannot
    see one end zone from the other, and the broadcast is mostly guesswork.
  effects:
    deepPassChance: 0.88
    passAccuracy: 0.96
  weather:
    - key: thin
      label: "Thin Fog"
      text: "A haze over the field. Both end zones are visible, just barely."
      effects: {}
    - key: rolling
      label: "Rolling Bank"
      text: "The fog is moving across in waves. Receivers keep disappearing and coming back."
      effects: {deepPassChance: 0.80, passAccuracy: 0.93}
    - key: pea
      label: "Pea Soup"
      text: "Visibility is about fifteen yards. Anything longer is thrown on faith."
      effects: {deepPassChance: 0.65, passAccuracy: 0.88, fgAccuracy: 0.90}
