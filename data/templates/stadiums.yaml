# Stadiums and their weather.
#
# These are the Cores' RECONSTRUCTIONS of the old floosball venues, assembled from
# fragmentary broadcast transmissions. The Cores do not actually know where each
# stadium was or what it looked like, so every one is a guess built from the team's
# name and a few garbled signals. That is why a team called Rocks ends up playing in
# a mine and the Jetskis play out on open water. The venues are meant to be
# fantastical places, not stadiums with a gimmick.
#
# WEATHER IS NATIVE TO THE SETTING. A cavern has no rain. It has dripping, dust and
# dark. A moving train has tunnels and crosswind. Open water has swell and fog. Each
# venue therefore carries its OWN weather table rather than drawing from a league-wide
# one.
#
# ⚠️ THE CITY IS NEVER RENDERED STRAIGHT (owner, 2026-08-19). A venue is not "what this
# city is like" — that is tourism, and it is what the first draft of this file mostly
# was. The Cores are reconstructing across an enormous gap in time from a damaged
# archive, so a city feature arrives DISTORTED, or an artifact of the Cores' own far
# future arrives misdated into what they believe was the era of the sport. Two flavors,
# both good, mix freely:
#
# ⚠️ WEATHER DOES NOT HAVE TO SUPPRESS (owner, 2026-08-19). Real weather almost only
# ever subtracts, and the first version of this file inherited that without noticing:
# 92% of every effect in it was a penalty, with passAccuracy lowered in 40 of 40
# conditions. That makes weather a pure drag on scoring, makes Criticality a drought
# rather than a spectacle, and reduces 32 places to 32 amounts of difficulty. Two ways
# out, and BOTH are in use:
#
#   PHYSICAL     thin air at altitude carries the ball (Colorado, Mexico City), heat
#                thins it the same way (Arizona), a sealed room has no wind at all
#                (Las Vegas, San Francisco), a tower has a standing updraft (Seattle),
#                and ground that freezes or bakes hard runs fast (Buffalo, Georgia,
#                Philadelphia). Note the split: weather acts on the AIR, so it boosts
#                ball flight; the run game is helped by SURFACE.
#
#   SUBVERSION   these are not real places and their weather need not obey. A cavern
#                has no wind at all, so the best throwing conditions in the league are
#                underground. A Tuesday on a loop has been REHEARSED. A hive is the
#                most coordinated thing alive. Boston's Criticality snaps to spec
#                instead of degrading, which is far worse than another penalty.
#                ⚠️ The subversion must be EARNED BY THE SETTING, not handed out.
#
#   DISTORTION   a real city feature at the wrong scale, material or literalism.
#                Chicago's mirrored monument comes back as an actual legume, grown.
#                Cleveland "rocks", so the Cores filed it under geology and built a mine.
#
#   ANACHRONISM  something from far after the sport, dated wrongly into it. Seoul's line
#                is reconstructed with soot and a coal tender, and crosses a continent in
#                an afternoon. Nothing in the archive says what a "phone" did, so the
#                Cores guessed.
#
# The tell should be legible to a reader without being explained: something in the
# description does not add up, and the Cores have not noticed.
#
# ⚠️ EQUAL MAGNITUDE, DIFFERENT SHAPE (owner, 2026-08-19). A team plays 14 games a
# season at its own venue, so a venue that hits harder than the others is a season-long
# tax on whoever lives there. Weather is symmetric inside a game, so the risk is not one
# side gaining, it is REPEATED EXPOSURE. Venues therefore differ in WHICH keys they
# touch and never in how hard they hit.
#
#   always-on   every home game, full strength. Held to ~0.130 total deviation, TIGHT.
#   weather     scaled to a quarter in a settled league and varies game to game, so it
#               averages out. Held to ~0.210 per condition, looser.
#
# Measured before this was enforced: always-on ran 0.070 to 0.263, a 3.8x spread, i.e.
# St. Louis carried nearly four times Minnesota's permanent load. Equalizing scales
# every deviation in a venue by ONE factor, which preserves the proportions between its
# keys exactly, so a venue still feels like itself and only its weight changes.
#
# ⚠️ Do NOT equalize the SHAPE. 25 distinct key combinations across 32 venues is what
# makes these different places instead of one weather system with 32 names on it.
# `test_stadium_weather.py` pins the magnitude bands and the shape count together.
#
# ⚠️ KEYED BY TEAM ID, not team name. Team names change, and six entries in the
# previous version of this file had already gone stale that way. `team:` is for
# readers; nothing looks up by it.
#
# Schema:
#   <team_id>:
#     team: Name                 # readability only, never used as a key
#     name: "Venue Name"         # the venue's proper name (fan-submittable)
#     setting: one line          # the fantastical premise
#     icon: kebab-case-key       # SVG key on the frontend
#     tagline: short pregame line
#     description: |             # longer flavor for hover/modal
#     effects:                   # ALWAYS-ON venue character, multiplicative (1.0 = none)
#       passAccuracy / deepPassChance / footing / fgAccuracy / sackRate
#       fumbleRate / puntDistance / returnYards / paceMod / visibility
#
# ⚠️ `visibility` IS TWO-SIDED and is the only key here that is. Darkness was first
# written as a passing penalty, which quietly says poor sight only costs the offense --
# it does not, because a carrier nobody can see is a carrier nobody can tackle. Below
# 1.0 it costs pass accuracy (mildly), deep passing (steeply), and raises punt muffs and
# fair catches, AND it takes the tackler's resistance down so a dark field hands yards
# to the runner. Use it INSTEAD of a raw passing penalty wherever the cause is sight;
# carrying both charges for the same darkness twice.
#     weather:                   # this venue's own conditions
#       - key: calm              # EVERY venue needs exactly one calm state, listed first
#         label: "Short Name"
#         text: "One sentence describing it accurately."
#         effects: {}
#       - key: ...
#         unrealOnly: true       # Criticality only. Optional, at most one or two.
#
# ⚠️ Effects are authored at ROUGH strength. The intensity ladder scales the deviation
# from 1.0, so do NOT write one set of numbers per intensity level.
#
# ⚠️ `text` is a REQUIREMENT, not flavor: the weather a game reports must be the
# weather it actually played under. Say what it does.

1:
  team: Strangers
  name: "Shadow Court"
  setting: A city the archive holds eight million records for, and not one name.
  icon: shadow-figure
  tagline: Nobody Sees You Coming
  description: |
    The register for this place survives intact and is entirely anonymous. The Cores
    built a court to match it: the lighting is dim, the corners are dark, and you can
    never quite make out who is standing on the far sideline.
  effects:
    passAccuracy: 0.958
    deepPassChance: 0.916
  weather:
    - key: halflight
      label: "Half Light"
      text: "Enough light to play by. The far sideline stays hard to read."
      effects: {}
    - key: lengthening
      label: "Lengthening Shadows"
      text: "The shadows are crossing the field. Deep throws vanish into them."
      effects: {visibility: 0.9}
    - key: gloom
      label: "Gloom"
      text: "The light is going out of the place. Receivers are losing the ball late."
      effects: {visibility: 0.923, fgAccuracy: 0.954}
    - key: blackout
      label: "Total Dark"
      unrealOnly: true
      text: "The lights have failed entirely. They are playing by sound."
      effects: {visibility: 0.829, fgAccuracy: 0.895, fumbleRate: 1.131}

2:
  team: Normals
  name: "Procedure Field"
  setting: A city whose only surviving document is a specification, followed exactly.
  icon: gridlines
  tagline: Everything As Specified
  description: |
    Nothing came through about this place except a standards document, so the Cores
    built the standards document. Regulation field, regulation grass, regulation
    lighting. A sign on the wall reads PROCEDURE and nobody has established what it
    refers to.
  effects:
    deepPassChance: 0.937
    footing: 0.976
    paceMod: 0.961
  weather:
    - key: nominal
      label: "Nominal"
      text: "Conditions are within specification. All of them."
      effects: {}
    - key: scheduled
      label: "Scheduled Precipitation"
      text: "Rain began exactly on the hour. It is expected to stop exactly on the hour."
      effects: {passAccuracy: 0.918, fumbleRate: 1.131}
    - key: overcast
      label: "Standard Overcast"
      text: "Uniform gray cloud, evenly distributed. Deep throws are hard to track against it."
      effects: {visibility: 0.895}
    - key: tolerance
      label: "Within Tolerance"
      unrealOnly: true
      text: "Every reading has come back exactly nominal, which has never once happened. The ball is going precisely where it is thrown."
      effects: {visibility: 0.81, fgAccuracy: 1.18, fumbleRate: 0.85}

3:
  team: Broads
  name: "Asphalt Acres"
  setting: A street the archive describes only as broad, reconstructed broad enough to lay a field across.
  icon: asphalt
  tagline: Hard Top
  description: |
    One street survives for this city and the record gives a single property of it. The
    Cores took the property literally, so the street is wide enough to hold a stadium,
    and they left the traffic on it.
  effects:
    footing: 1.036
    fumbleRate: 1.053
    returnYards: 1.044
  weather:
    - key: dry
      label: "Dry Top"
      text: "The blacktop is dry and fast underfoot."
      effects: {}
    - key: shimmer
      label: "Heat Shimmer"
      text: "Heat coming off the asphalt is bending everything past thirty yards."
      effects: {deepPassChance: 0.867, fgAccuracy: 0.934}
    - key: baked
      label: "Baked Blacktop"
      text: "The top has cured hard and dry. Anyone who gets a step is gone."
      effects: {footing: 1.11, returnYards: 1.12, fumbleRate: 0.94}
    - key: slick
      label: "Wet Blacktop"
      text: "Rain on asphalt with nowhere to drain. Footing is gone."
      effects: {footing: 0.935, fumbleRate: 1.117, passAccuracy: 0.967}
    - key: melt
      label: "Melting"
      unrealOnly: true
      text: "The surface has gone soft and is pulling at their feet. Yard lines are running."
      effects: {footing: 0.829, paceMod: 1.152, sackRate: 1.183, returnYards: 0.817}

4:
  team: Monuments
  name: "Colossus Ground"
  setting: A field laid between commemorative colossi the archive cannot name or account for.
  icon: obelisk
  tagline: In the Shadow of Giants
  description: |
    Stone figures the size of hills stand at each corner, helmeted, holding objects the
    Cores have logged as sporting equipment. Nothing in the archive records who they
    commemorate, and the proportions are wrong for anything that was ever human.
  effects:
    fgAccuracy: 0.936
    paceMod: 0.936
  weather:
    - key: clearstone
      label: "Clear"
      text: "Still and clear. The monuments throw four long shadows across the field."
      effects: {}
    - key: dust
      label: "Stone Dust"
      text: "Dust is coming off the monuments and hanging over the field. Hard to see, hard to breathe."
      effects: {visibility: 0.946, paceMod: 1.105}
    - key: glare
      label: "Marble Glare"
      text: "Sun off polished stone, straight into the eyes of anyone looking up."
      effects: {visibility: 0.952, fgAccuracy: 0.938, fumbleRate: 1.047}
    - key: tremor
      label: "Tremor"
      unrealOnly: true
      text: "Something enormous is moving. The ground will not hold still long enough to kick from."
      effects: {fgAccuracy: 0.761, fumbleRate: 1.269, passAccuracy: 0.916, footing: 0.91}

5:
  team: Melons
  name: "Mellon Quadrangle"
  setting: A university quadrangle given over entirely to melon cultivation, tended by machines.
  icon: melon
  tagline: Watch Your Footing
  description: |
    The archive records a great research institution here and gives its name twice,
    spelled differently each time. The Cores resolved the discrepancy agriculturally.
    The quadrangle is under vines, the research is melons, and the machines still
    working between the rows are logged as period farm equipment.
  effects:
    fumbleRate: 1.088
    footing: 0.956
  weather:
    - key: ripe
      label: "Ripe"
      text: "Warm and still. The fruit is intact, for now."
      effects: {}
    - key: humid
      label: "Growing Weather"
      text: "Heavy humid air. The ball is slick and the vines are visibly moving."
      effects: {passAccuracy: 0.928, fumbleRate: 1.144}
    - key: burst
      label: "Burst Fruit"
      text: "Split melons all over the field. The footing is sugar and pulp."
      effects: {footing: 0.942, fumbleRate: 1.096, returnYards: 0.942}
    - key: overgrowth
      label: "Overgrowth"
      unrealOnly: true
      text: "The vines are growing fast enough to watch. They are taking the field back."
      effects: {footing: 0.81, paceMod: 1.19, sackRate: 1.158, deepPassChance: 0.842}

6:
  team: Rocks
  name: "Bedrock Cavern"
  setting: A mine. The archive said this city rocked, and the Cores filed that under geology.
  icon: cavern
  tagline: Carved in Stone
  description: |
    One phrase survived about this city and what it did. It was parsed as a claim about
    the bedrock, and the venue was built to match. Play happens under a few hundred feet
    of stone, every sound comes back twice, and the far end of the cavern is simply dark.
  effects:
    deepPassChance: 0.958
    fumbleRate: 0.964
    puntDistance: 0.952
  weather:
    - key: stillair
      label: "Still Air"
      text: "Dead still and cool. Sound carries strangely, but the field is clean."
      effects: {}
    - key: seep
      label: "Seepage"
      text: "Water is coming through the rock and pooling on the field. The ball is wet."
      effects: {visibility: 0.973, fumbleRate: 1.115, footing: 0.954}
    - key: deadair
      label: "Dead Air"
      text: "There is no weather down here at all. No wind has ever reached this field and the ball knows it."
      effects: {deepPassChance: 1.1, fgAccuracy: 1.08, puntDistance: 1.05}
    - key: dustfall
      label: "Dust Fall"
      text: "Fine rock dust drifting down from the ceiling. Nobody can see the roof and nobody wants to."
      effects: {visibility: 0.902}
    - key: collapse
      label: "Rockfall"
      unrealOnly: true
      text: "Pieces of the ceiling are coming down onto the field. They are still playing."
      effects: {fumbleRate: 1.337, passAccuracy: 0.865, footing: 0.852, paceMod: 1.135}

7:
  team: Beans
  name: "Cloud Gate"
  setting: A valley beneath an enormous polished bean the Cores believe was grown rather than built.
  icon: fog-bank
  tagline: Soupy
  description: |
    The archive records a mirrored monument at the center of this city. The
    reconstruction came back organic: a legume the size of a cathedral, warm to the
    touch, sitting over the bowl of the ground. The fog is what it gives off.
  effects:
    deepPassChance: 0.908
    passAccuracy: 0.969
  weather:
    - key: thin
      label: "Thin Fog"
      text: "A haze over the field. Both end zones are visible, just barely."
      effects: {}
    - key: rolling
      label: "Rolling Bank"
      text: "The fog is moving across in waves. Receivers keep disappearing and coming back."
      effects: {visibility: 0.903}
    - key: pea
      label: "Pea Soup"
      text: "Visibility is about fifteen yards. Anything longer is thrown on faith."
      effects: {visibility: 0.925, fgAccuracy: 0.968}
    - key: whiteout
      label: "Whiteout"
      unrealOnly: true
      text: "The fog has closed completely. Nobody on the field can see the ball, including whoever has it."
      effects: {visibility: 0.835, fgAccuracy: 0.9, fumbleRate: 1.1}

8:
  team: Caddies
  name: "Eldorado Greens"
  setting: A marque and a model, one of which the Cores mistook for a golf course.
  icon: flagstick
  tagline: Play It As It Lies
  description: |
    Two words survive for this city and both of them are a car. The Cores read the
    second as a country club and built one, immaculately, with bunkers inside the field
    of play and a crowd asked to stay quiet at the snap.
  effects:
    fgAccuracy: 1.04
    footing: 0.97
    paceMod: 0.941
  weather:
    - key: fair
      label: "Fair"
      text: "Perfect golfing weather, which turns out to be perfect football weather."
      effects: {}
    - key: links
      label: "Links Wind"
      text: "Steady crosswind off the open course. It is pushing every kick and punt."
      effects: {fgAccuracy: 0.929, puntDistance: 0.929, deepPassChance: 0.943}
    - key: dew
      label: "Heavy Dew"
      text: "The grass has not dried out. Cuts are slipping and the ball is damp."
      effects: {footing: 0.915, fumbleRate: 1.128}
    - key: lightning
      label: "Lightning Hold"
      unrealOnly: true
      text: "The horn has sounded and nobody has left the field. It is striking the fairway."
      effects: {visibility: 0.943, paceMod: 1.257, fgAccuracy: 0.817, fumbleRate: 1.183}

9:
  team: Pops
  # ⚠️ PAIRED WITH 32 (Salt Lake City Sodas). Owner: the two are RIVALS, and the names
  # come from the dispute over what the drink is called. Both venues are soda/pop themed
  # and each is certain it does it better. Write them as a matched pair or the rivalry
  # stops reading. This side argues the word is the SOUND, so it bottles and caps.
  name: "The Bottling Floor"
  setting: A bottling hall where the field runs between the lines, named for the noise a cap makes.
  icon: bottle-cap
  tagline: That Is the Sound It Makes
  description: |
    The archive carries two names for one drink and two cities each certain the other is
    wrong. This one holds that the word is the sound, and built a hall to prove it. The
    field runs between the lines, the caps come off all game, and the Cores have entered
    the noise into the record as evidence.
  effects:
    paceMod: 1.075
    passAccuracy: 0.944
  weather:
    - key: capped
      label: "Running Clean"
      text: "The line is moving and nothing has gone over. Loud, but the floor is dry."
      effects: {}
    - key: spray
      label: "Cap Spray"
      text: "Caps coming off faster than the line can take them. There is a fine mist of it over the field."
      effects: {visibility: 0.963, fumbleRate: 1.144}
    - key: sticky
      label: "Sticky Floor"
      text: "Enough has gone over that the floor has turned tacky. Nobody is cutting cleanly."
      effects: {footing: 0.925, paceMod: 1.062, sackRate: 1.075}
    - key: burst
      label: "The Line Bursts"
      unrealOnly: true
      text: "Every bottle on the line has gone at once. The hall is full of it and the game is still on."
      effects: {fumbleRate: 1.314, footing: 0.84, passAccuracy: 0.886, paceMod: 1.171}

10:
  team: Cranes
  name: "KACL Tower"
  setting: A word the archive gives three times meaning three different things, all of them built.
  icon: radio-tower
  tagline: We're On the Air
  description: |
    The record holds cranes at the docks, a bird, and a man who talked for a living, and
    does not distinguish between them. The venue is a platform at altitude with a live
    radio booth on the sideline and the city a long way below.
  effects:
    puntDistance: 1.052
    fgAccuracy: 0.956
    deepPassChance: 1.035
  weather:
    - key: clearair
      label: "Clear Air"
      text: "Cold and clear at altitude. The wind is steady and readable."
      effects: {}
    - key: gust
      label: "Gusting"
      text: "The wind up here is turning over. Kicks are being taken off line."
      effects: {fgAccuracy: 0.923, puntDistance: 0.934, deepPassChance: 0.945}
    - key: updraft
      label: "Standing Updraft"
      text: "The air is coming up the tower in a steady column and holding everything thrown into it."
      effects: {deepPassChance: 1.12, puntDistance: 1.1, fgAccuracy: 0.96}
    - key: cloudbase
      label: "In the Cloud"
      text: "The cloud base has come down over the deck. They are playing inside it."
      effects: {deepPassChance: 0.863, passAccuracy: 0.951}
    - key: icing
      label: "Icing"
      unrealOnly: true
      text: "Ice is forming on the platform and on the ball. Nothing is being held onto."
      effects: {fumbleRate: 1.33, footing: 0.868, fgAccuracy: 0.832, passAccuracy: 0.904}

11:
  team: Pinecones
  name: "Evergreen Park"
  setting: Forest the archive dates as older than the archive.
  icon: conifer
  tagline: The Grove
  description: |
    The trees here return a figure the Cores have flagged twice and left standing. The
    canopy closes over most of the field, and trees inside the field of play are treated
    as part of it, which the visiting team is never quite ready for.
  effects:
    deepPassChance: 0.948
    footing: 0.979
    puntDistance: 0.948
  weather:
    - key: sheltered
      label: "Sheltered"
      text: "The canopy is holding the weather off. Still and green underneath."
      effects: {}
    - key: needlefall
      label: "Needle Fall"
      text: "Needles coming down in sheets and covering the footing."
      effects: {footing: 0.906, fumbleRate: 1.118}
    - key: sap
      label: "Sap"
      text: "Sap is dripping through the canopy onto the field and the ball."
      effects: {passAccuracy: 0.938, fumbleRate: 0.906, paceMod: 1.047}
    - key: windthrow
      label: "Windthrow"
      unrealOnly: true
      text: "Whole trees are coming down at the edge of the field. They have not stopped play."
      effects: {paceMod: 1.176, footing: 0.883, deepPassChance: 0.766, fumbleRate: 1.146}

12:
  team: Oysters
  name: "Brine Basin"
  setting: Oysters, filed at nine thousand feet, and nobody queried it.
  icon: salt-flat
  tagline: Mountain Brine
  description: |
    The archive places this city's shellfish at altitude and offers no explanation. The
