  effects:
    runYardage: 1.04
    fumbleRate: 1.06
    returnYards: 1.05
  weather:
    - key: dry
      label: "Dry Top"
      text: "The blacktop is dry and fast underfoot."
      effects: {}
    - key: shimmer
      label: "Heat Shimmer"
      text: "Heat coming off the asphalt is bending everything past thirty yards."
      effects: {deepPassChance: 0.88, fgAccuracy: 0.94}
    - key: slick
      label: "Wet Blacktop"
