      effects: {paceMod: 0.812, passAccuracy: 0.906, fumbleRate: 1.188, deepPassChance: 0.812}

14:
  team: Slippers
  # ⚠️ SETTLED, and the only venue in this file that is. Fan contribution, Wizard of Oz
  # direction, confirmed by the owner 2026-08-19. Do not redesign the location or the
  # vibe. The weather ladder below is ours to tune; the setting is not.
  name: "Poppy Field"
  setting: An open field ringed by an expanse of red and white poppies, with gentle hills around it.
  icon: poppy
  tagline: No Place Like Home
  description: |
    An open field surrounded by an expanse of red and white poppies, with the end zones
    marked out by flower patches. Gentle hills rise around the field of play and the
    fans picnic on them. The scent carries, and visiting teams find themselves slowing
    down in the third quarter without being able to say why.
  effects:
    paceMod: 1.082
    footing: 0.951
  weather:
    - key: bloom
      label: "In Bloom"
      text: "Warm, bright and still. Good picnic weather on the hills, and a clean field."
      effects: {}
    - key: pollen
      label: "Heavy Pollen"
      text: "Pollen thick in the air. Legs are going heavy earlier than they should."
      effects: {paceMod: 1.08, footing: 0.933, sackRate: 1.067}
    - key: emerald
