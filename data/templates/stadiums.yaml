13:
  team: Tuesdays
  name: "The Long Tuesday"
  setting: A carnival Tuesday that will not advance, with the parade still short of the end of its route.
  icon: calendar-day
  tagline: Again
  description: |
    The archive holds exactly one date for this city, and it is the same date every
    time it is read: a Tuesday, mid-carnival. The reconstruction runs that Tuesday on a
    loop, parade included. The parade has not reached the end of the route yet.
  effects:
    paceMod: 0.937
    deepPassChance: 0.937
  weather:
    - key: closeair
      label: "Close Air"
      text: "Warm, heavy and still, the way it always is at this hour on this day."
      effects: {}
    - key: samerain
      label: "The Same Rain"
      text: "The warm downpour that always comes, at the hour it always comes, off the same street."
      effects: {passAccuracy: 0.92, fumbleRate: 1.134}
    - key: dejavu
